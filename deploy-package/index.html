    <!-- Kept media-free so the theme script below owns it; a media-scoped pair
         would follow the OS and contradict an explicit user choice. -->
    <meta name="theme-color" content="#761713" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="index, follow" />

    <!-- Resolve the theme before first paint so dark-mode visitors never see a
         flash of the light palette. Must stay in step with src/contexts/ThemeContext.jsx. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark =
            stored === 'dark' ||
            stored === 'light'
              ? stored === 'dark'
              : window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches;

          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#14100E');
          }
        } catch (e) {
          /* Storage blocked — fall through to the light default. */
        }
      })();
    </script>
