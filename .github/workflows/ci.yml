name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client --no-audit --no-fund

      - name: Lint
        run: npm run lint --prefix client

      - name: Build
        # No Firebase secrets here on purpose: the build falls back to the
        # committed client/.env.production values (public web config that
        # ships in the browser bundle by design). Real secrets are only
        # overlaid at deploy time by deploy-hostinger.yml.
        run: npm run build --prefix client
